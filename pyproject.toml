[project]
name = "personalassistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain>=1.3.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.2.3",
    "langchain-huggingface>=1.2.2",
    "langchain-mcp-adapters>=0.3.2,<0.4.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.1",
    "langgraph-api>=0.11.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-cli[inmem]>=0.4.26",
    "langsmith>=0.8.5",
    "mcp[cli]>=1.30.0,<2.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.12.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "sentence-transformers>=5.5.1",
    "uvicorn>=0.48.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [".", "src", "mcp_servers/personal-memory-mcp"]

